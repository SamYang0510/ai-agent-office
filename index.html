const SIM=(()=>{const GX=24,GZ=18,grids={};
 const grid=fi=>{if(grids[fi])return grids[fi];const g=new Uint8Array(GX*GZ);for(let ix=0;ix<GX;ix++)for(let iz=0;iz<GZ;iz++){const x=-S/2+.5+ix,z=-D/2+.5+iz;if(ix<1||ix>GX-2||iz<1||iz>GZ-2||OBST[fi].some(o=>x>o[0]-.35&&x<o[1]+.35&&z>o[2]-.35&&z<o[3]+.35))g[ix+iz*GX]=1}return grids[fi]=g};
 const cell=(x,z)=>[Math.max(0,Math.min(GX-1,Math.round(x+S/2-.5))),Math.max(0,Math.min(GZ-1,Math.round(z+D/2-.5)))];
 const nearFree=(g,x,z)=>{const [cx,cz]=cell(x,z);let best=null,bd=1e9;for(let ix=0;ix<GX;ix++)for(let iz=0;iz<GZ;iz++)if(!g[ix+iz*GX]){const d=(ix-cx)**2+(iz-cz)**2;if(d<bd){bd=d;best=[ix,iz]}}return best};
 const W=(c)=>[-S/2+.5+c[0],-D/2+.5+c[1]];
 function path(fi,x0,z0,x1,z1){const g=grid(fi);const a=nearFree(g,x0,z0),b=nearFree(g,x1,z1);if(!a||!b)return[[x1,z1]];const prev=new Int32Array(GX*GZ).fill(-1),q=[a[0]+a[1]*GX];prev[q[0]]=q[0];
  for(let h=0;h<q.length;h++){const c=q[h];if(c===b[0]+b[1]*GX)break;const cx=c%GX,cz=(c/GX)|0;for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,nz=cz+dz;if(nx<0||nz<0||nx>=GX||nz>=GZ)continue;const n=nx+nz*GX;if(g[n]||prev[n]>=0)continue;prev[n]=c;q.push(n)}}
  let c=b[0]+b[1]*GX;if(prev[c]<0)return[[x1,z1]];const pts=[];while(c!==prev[c]){pts.push(W([c%GX,(c/GX)|0]));c=prev[c]}pts.push(W(a));pts.reverse();
  const out=[pts[0]];for(let i=1;i<pts.length-1;i++){const p=out[out.length-1],n=pts[i+1];if(!(p[0]===n[0]||p[1]===n[1]))out.push(pts[i])}out.push(pts[pts.length-1]);out.push([x1,z1]);return out}
 const bots=ALIVE.filter(a=>a.gp.parent===scene).map((A,k)=>{let h=0;for(const ch of A.name)h=h*31+ch.charCodeAt(0)|0;const r=rngOf(h^0x5eed);const fi=floorOf(A.gp.position.y);
  return {A,r,fi,home:[A.gp.position.x,A.gp.position.z,A.gp.rotation.y,A.pose],path:[],act:'home',timer:2+r()*10,wp:0}});
 function face(b,x,z){b.A.gp.rotation.y=Math.atan2(x-b.A.gp.position.x,z-b.A.gp.position.z)}
 function go(b,x,z,act,extra){b.path=path(b.fi,b.A.gp.position.x,b.A.gp.position.z,x,z);b.act=act;b.extra=extra;setPose(b.A,'stand');b.A.typing=false;b.walking=true}
 function pick(b){const r=b.r(),A=b.A;const mates=bots.filter(o=>o!==b&&o.fi===b.fi&&!o.walking);const m=MEET[b.fi];
  if(r<.35)go(b,b.home[0],b.home[1],'home');
  else if(r<.55&&m){const sx=m[0]+(b.r()-.5)*(m[2]-1.4),sz=m[1]+(b.r()<.5?-1:1)*(m[3]/2-.9);go(b,sx,sz,'meet',[m[0],m[1]])}
  else if(r<.72&&mates.length){const o=mates[(b.r()*mates.length)|0];const p=o.A.gp.position;const g=grid(b.fi);const c=nearFree(g,p.x+.9,p.z+.9);const w=W(c);go(b,w[0],w[1],'chat',o)}
  else if(r<.88){const x=(b.r()-.5)*(S-4),z=D/2-1.3;go(b,x,z,'window',[x,D/2+3])}
  else{b.walking=false;b.act='stretch';setPose(A,'stand');b.t0=performance.now()}
  b.timer=8+b.r()*22}
 function arrive(b){const A=b.A;b.walking=false;A.legs.forEach(l=>l.rotation.x=0);A.up.position.y=A.off+.35;
  if(b.act==='home'){A.gp.position.x=b.home[0];A.gp.position.z=b.home[1];A.gp.rotation.y=b.home[2];setPose(A,b.home[3]);A.typing=b.home[3]==='sit'}
  else if(b.act==='meet'){face(b,b.extra[0],b.extra[1]);setPose(A,'sit')}
  else if(b.act==='chat'){if(b.extra)face(b,b.extra.A.gp.position.x,b.extra.A.gp.position.z)}
  else if(b.act==='window'){face(b,b.extra[0],b.extra[1])}}
 return function(dt,t){bots.forEach(b=>{const A=b.A;
  if(b.walking){const tgt=b.path[0];if(!tgt){arrive(b);return}const p=A.gp.position;const dx=tgt[0]-p.x,dz=tgt[1]-p.z,d=Math.hypot(dx,dz);const st=1.3*dt;
   if(d<=st){p.x=tgt[0];p.z=tgt[1];b.path.shift();if(!b.path.length)arrive(b)}else{p.x+=dx/d*st;p.z+=dz/d*st;const ry=Math.atan2(dx,dz);let dr=ry-A.gp.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));A.gp.rotation.y+=dr*Math.min(1,dt*10)}
   const ph=t*9+A.ph;A.legs[0].rotation.x=Math.sin(ph)*.5;A.legs[1].rotation.x=-Math.sin(ph)*.5;A.arms[0].rotation.x=-Math.sin(ph)*.35;A.arms[1].rotation.x=Math.sin(ph)*.35;A.up.position.y=A.off+.35+Math.abs(Math.cos(ph))*.04;return}
  if(b.act==='stretch'){const e=(performance.now()-b.t0)/1000;const k=Math.min(1,e)*(e<4?1:Math.max(0,5-e));A.arms.forEach((m,j)=>{m.rotation.x=-2.9*k;m.rotation.z=(j?-1:1)*.2*k;m.position.y=A.gp.userData.base0[j]-A.off*0+.45*k});if(e>5){A.arms.forEach((m,j)=>m.position.y=A.gp.userData.base0[j]);setPose(A,'stand');b.act='idle'}}
  if(b.act==='chat'&&b.extra){A.head.rotation.y=Math.sin(t*1.7+A.ph)*.25}
  b.timer-=dt;if(b.timer<=0){A.head.rotation.y=0;pick(b)}})}})();
